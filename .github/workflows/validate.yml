name: Validate Rocket Lab 3D

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate compressed runtime
        run: npm run check
